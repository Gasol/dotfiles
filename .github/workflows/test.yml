name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Tool versions come from mise.toml, so CI and local runs match.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: make lint

  # No stow on the runner, so bootstrap-stow.sh downloads, verifies and builds 2.4.1.
  build-stow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make test

  # Debian 13 ships stow 2.4.1, so bootstrap-stow.sh uses the system one.
  system-stow:
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - run: apt-get update && apt-get install -y make git perl curl stow
      - uses: actions/checkout@v7
      - run: make test
